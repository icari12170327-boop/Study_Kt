name: Worker 테스트 · 배포

on:
  pull_request:
    paths: ['worker/**', 'shared/**', '.github/workflows/deploy-worker.yml']
  push:
    branches: [main]
    paths: ['worker/**', 'shared/**', '.github/workflows/deploy-worker.yml']

permissions:
  contents: read

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_CLOUDFLARE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm run typecheck && npm test && npm run build
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Worker 배포
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_CLOUDFLARE_TOKEN == 'true' && env.HAS_CLOUDFLARE_ACCOUNT == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      - name: 배포 키 미등록 안내
        if: github.event_name == 'push' && (env.HAS_CLOUDFLARE_TOKEN != 'true' || env.HAS_CLOUDFLARE_ACCOUNT != 'true')
        run: echo 'Cloudflare Secrets가 없어 배포만 건너뛰었습니다. Worker 검사는 완료했습니다.'
