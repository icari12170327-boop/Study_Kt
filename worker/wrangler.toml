name = "study-kt-proxy"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare 대시보드 Workers Logs에서 오류 로그를 볼 수 있게 한다.
[observability]
enabled = true

[vars]
ALLOWED_ORIGINS = "https://icari12170327-boop.github.io"
REALTIME_MODEL = "gpt-realtime-2.1-mini"
TEXT_MODEL = "gpt-5-nano"
TRANSCRIBE_MODEL = "gpt-4o-mini-transcribe"
TRANSCRIBE_LIMIT_DAY = "60"
TRANSCRIBE_MINUTES_DAY = "60"
TALK_MINUTES_kid1 = "10"
TALK_MINUTES_kid2 = "15"
TALK_MINUTES_parent = "60"
TALK_MINUTES_MONTH_TOTAL = "3000"
GENERATE_LIMIT_DAY_TOTAL = "200"
KRW_PER_TALK_MINUTE = "15"

[[kv_namespaces]]
binding = "USAGE"
id = "6cd93b6e51904a5ea0601dfdd089bfca"

[[durable_objects.bindings]]
name = "FAMILY"
class_name = "FamilyUsage"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FamilyUsage"]
